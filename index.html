<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#111827">
<meta name="description" content="Juego de tres en línea para dos participantes.">
<title>Tres en línea — Mini juego</title><link rel="stylesheet" href="styles.css"><script src="app.js" defer></script>
</head>
<body>
<div class="ambient ambient-one"></div><div class="ambient ambient-two"></div>
<main class="game-layout">
  <header class="topbar"><a class="brand" href="#" aria-label="Tres en línea"><span class="brand-icon">✳</span> PLAYROOM</a><span class="top-label">MINI JUEGO · 01</span></header>
  <section class="intro"><p class="eyebrow">DOS JUGADORES · UN TABLERO</p><h1>Tres en <span>línea.</span></h1><p class="intro-copy">Una partida rápida, una revancha más. ¿Quién se queda con la victoria?</p></section>
  <section class="game-card" aria-label="Juego de tres en línea">
    <div class="scoreboard">
      <div class="score score-x active" id="scoreCardX"><span class="player-symbol">×</span><div><small>JUGADOR 1</small><strong>X</strong></div><b id="scoreX">0</b></div>
      <div class="score score-draw"><div><small>EMPATES</small><strong>—</strong></div><b id="scoreDraw">0</b></div>
      <div class="score score-o" id="scoreCardO"><span class="player-symbol">○</span><div><small>JUGADOR 2</small><strong>O</strong></div><b id="scoreO">0</b></div>
    </div>
    <div class="status-pill" id="status" aria-live="polite"><span class="status-dot"></span> Turno del jugador X</div>
    <div class="board" id="board" role="group" aria-label="Tablero de tres por tres">
      <button class="cell" data-cell="0" aria-label="Fila 1, columna 1"></button><button class="cell" data-cell="1" aria-label="Fila 1, columna 2"></button><button class="cell" data-cell="2" aria-label="Fila 1, columna 3"></button>
      <button class="cell" data-cell="3" aria-label="Fila 2, columna 1"></button><button class="cell" data-cell="4" aria-label="Fila 2, columna 2"></button><button class="cell" data-cell="5" aria-label="Fila 2, columna 3"></button>
      <button class="cell" data-cell="6" aria-label="Fila 3, columna 1"></button><button class="cell" data-cell="7" aria-label="Fila 3, columna 2"></button><button class="cell" data-cell="8" aria-label="Fila 3, columna 3"></button>
    </div>
    <div class="game-actions"><button class="new-game" id="newGame">↻ Nueva partida</button><button class="reset" id="reset">Reiniciar marcador</button></div>
  </section>
  <footer>HECHO PARA DIVERTIRSE <span>✦</span> SIN INSTALACIONES</footer>
</main>
</body></html>
